[package]
name = "skate-quest"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Skate 3 Rust engine as a standalone Meta Quest 3 passthrough app"

[lib]
name = "skate_quest"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
skate-game = { path = "../skate-game", default-features = false, features = ["xr"] }
bevy = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# cargo-apk reads this block (see scripts/quest/README.md).
[package.metadata.android]
package = "com.andrewnakas.skate3ar"
apk_name = "skate3ar"
build_targets = ["aarch64-linux-android"]
# Holds arm64-v8a/libopenxr_loader.so (Khronos loader; fetched by
# scripts/quest/fetch-openxr-loader.sh, never committed).
runtime_libs = "runtime_libs"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 32
target_sdk_version = 32

[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true
version = 1

[[package.metadata.android.uses_feature]]
name = "com.oculus.feature.PASSTHROUGH"
required = true

[[package.metadata.android.uses_feature]]
name = "oculus.software.handtracking"
required = false

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.HAND_TRACKING"

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.USE_SCENE"

[[package.metadata.android.uses_permission]]
name = "com.oculus.permission.USE_ANCHOR_API"

# The Khronos loader finds Meta's runtime through the runtime broker.
[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR"

[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR_SYSTEM"

[[package.metadata.android.queries.provider]]
authorities = "org.khronos.openxr.runtime_broker;org.khronos.openxr.system_runtime_broker"
name = "org.khronos.openxr"

[[package.metadata.android.queries.intent]]
actions = ["org.khronos.openxr.OpenXRRuntimeService"]

[package.metadata.android.application]
label = "Skate 3 AR"
debuggable = true
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"

[[package.metadata.android.application.meta_data]]
name = "com.oculus.supportedDevices"
value = "quest3|quest3s|questpro"

[[package.metadata.android.application.meta_data]]
name = "com.oculus.intent.category.VR"
value = "vr_only"

[package.metadata.android.application.activity]
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
launch_mode = "singleTask"
orientation = "landscape"
resizeable_activity = false

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["com.oculus.intent.category.VR", "android.intent.category.LAUNCHER"]
