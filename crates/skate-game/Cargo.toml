[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "skate_game"
path = "src/lib.rs"

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[[bin]]
name = "skate3-audio-check"
path = "src/audio_check_main.rs"
test = false
required-features = ["retail"]

[[bin]]
name = "skate3-multiplayer"
path = "src/multiplayer_main.rs"
test = false
required-features = ["retail"]

[[bin]]
name = "skate3-custom-models"
path = "src/custom_models_main.rs"
test = false
required-features = ["retail"]

[features]
default = ["dev-dynamic", "retail"]
dev-dynamic = ["bevy/dynamic_linking"]
# The imported-disc tier: the faithful port of the retail game, run on the player's own converted
# Skate 3 data, and its importer. The GitHub builds have it; the store build (crates/sk8-quest) is
# built without it, so none of that code (nor the crates it needs) is in that app.
retail = [
    "dep:tracing-log", "dep:skate-core", "dep:skate-data", "dep:skate-audio-formats",
    "dep:skate-audio-core", "dep:half", "dep:skate-mods", "dep:skate-vehicles", "dep:skate-net",
    "dep:blake3", "dep:image", "dep:zip", "zip/deflate-flate2-zlib-rs",
]
# OpenXR passthrough mode (`--xr`); the Quest build always enables it.
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]
# Desktop XR keeps a mirror window beside the headset view.
xr-window = ["xr", "bevy_mod_openxr/window_support"]

[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug"] }
tracing-log = { version = "0.2", optional = true }
skate-core = { workspace = true, optional = true }
skate-data = { workspace = true, optional = true }
skate-audio-formats = { workspace = true, optional = true }
skate-audio-core = { workspace = true, optional = true }
half = { version = "=2.7.1", optional = true }
serde_json.workspace = true
serde.workspace = true
skate-mods = { path = "../skate-mods", optional = true }
skate-lite-sys = { path = "../skate-lite-sys" }

skate-vehicles = { path = "../skate-vehicles", optional = true }
skate-net = { path = "../skate-net", optional = true }
blake3 = { version = "=1.8.7", optional = true }
bevy_mod_openxr = { version = "=0.5.0", optional = true, features = ["fb_passthrough"] }
bevy_mod_xr = { version = "=0.5.0", optional = true }
openxr = { version = "0.21.1", optional = true }
# Unzips an imported Skate 3 bundle in the headset (xr::ui::import; retail only).
zip = { version = "6", optional = true, default-features = false }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png", "jpeg"] }

# Game pads on Quest come through the (vendored, patched) winit Android backend: xr::actions.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
naga_oil = { version = "=0.20.0", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "naga-ir"] }
