[workspace]
members = ["crates/skate-core", "crates/skate-data", "crates/skate-game", "crates/skate-mods", "crates/skate-vehicles", "crates/skate-net", "crates/skate-steam-relay", "crates/skate-audio-formats", "crates/skate-audio-core", "crates/skate-quest"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Bevy's default features, spelled out so the Quest crate can pick the
# NativeActivity glue instead of the default GameActivity (only one may be
# enabled). Identical to `default` on desktop.
bevy = { version = "=0.18.1", default-features = false, features = [
    "default_app", "2d_bevy_render", "3d_bevy_render", "ui_api", "ui_bevy_render",
    "scene", "audio", "picking",
    "std", "android_shared_stdcxx", "bevy_gilrs", "bevy_winit", "default_font",
    "multi_threaded", "webgl2", "x11", "wayland", "sysinfo_plugin",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }
skate-audio-formats = { path = "crates/skate-audio-formats" }
skate-audio-core = { path = "crates/skate-audio-core" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
strip = false

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
